<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Event Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f5f7fb;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
    }

    .navbar a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: 500;
    }

    .hero {
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      animation: fadeIn 1.5s ease-in-out;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .btn {
      background: white;
      color: #333;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    .btn:hover {
      background: #2575fc;
      color: white;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
      transition: 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 250px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      background: #222;
      color: white;
    }

    @media(max-width: 768px) {
      .cards {
        flex-direction: column;
        align-items: center;
      }
    }

    /* Loader */
    #loader{
      position: fixed;
      width: 100%;
      height: 100%;
      background: #0f2027;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .spinner{
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255,255,255,0.2);
      border-top: 6px solid #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin{
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
  </div>

  <div class="navbar">
    <h2>🎓 College Events</h2>
    <div>
      <a href="/">Home</a>
      <a href="/events">Events</a>
      <a href="/admin" style="background:white;color:#2575fc;padding:6px 12px;border-radius:6px;">Admin Login</a>
    </div>
  </div>

  <div class="hero">
    <h1>Discover & Join Amazing Events 🚀</h1>
    <p>Workshops • Hackathons • Cultural Fest • Seminars</p>
    <a href="/events" class="btn">🚀 Explore Events</a>
  </div>

  <div class="cards">
    <div class="card">
      <h2>{{ total_events }}</h2>
      <p>Total Events</p>
    </div>
    <div class="card">
      <h2>500+</h2>
      <p>Active Students</p>
    </div>
    <div class="card">
      <h2>20+</h2>
      <p>Expert Speakers</p>
    </div>
  </div>

  <div class="footer">
    <p>© 2026 College Event Management </p>
  </div>

<script>
window.addEventListener("load", function(){
  document.getElementById("loader").style.display = "none";
});
</script>

</body>
</html>
