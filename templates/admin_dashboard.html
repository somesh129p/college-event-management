<!DOCTYPE html>
<html>
<head>
<title>College Event Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
font-family:'Poppins',sans-serif;
background:#f8f9fa;
margin:0;
}

.navbar{
background:linear-gradient(90deg,#4b0082,#6f42c1);
}

.hero{
height:500px;
background:linear-gradient(135deg,#4b0082,#6f42c1);
color:white;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
flex-direction:column;
}

.hero h1{
font-size:48px;
font-weight:700;
}

.hero p{
font-size:20px;
margin-top:10px;
opacity:0.9;
}

.stat-card{
background:white;
border-radius:12px;
padding:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.feature-box{
text-align:center;
padding:30px;
}

.feature-box i{
font-size:40px;
color:#6f42c1;
}

.footer{
background:#212529;
color:white;
padding:40px 0;
margin-top:60px;
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow">
<div class="container">
<span class="navbar-brand">
<i class="bi bi-speedometer2"></i> Admin Dashboard
</span>

<div>
<a href="/" class="btn btn-light btn-sm me-2">Home</a>
<a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</div>
</div>
</nav>

<div class="container mt-4">

<h3 class="mb-4">Add Event</h3>

<form method="POST" enctype="multipart/form-data">

<div class="row g-3">

<div class="col-md-4">
<input name="name" class="form-control" placeholder="Event Name" required>
</div>

<div class="col-md-4">
<input type="date" name="date" class="form-control" required>
</div>

<div class="col-md-4">
<input name="venue" class="form-control" placeholder="Venue" required>
</div>

<div class="col-md-4">
<input type="file" name="image" class="form-control">
</div>

</div>

<button class="btn btn-success mt-3">
<i class="bi bi-plus-circle"></i> Add Event
</button>

</form>

<hr class="my-5">

<h3>All Events</h3>

<div class="row">

{% for event in events %}

<div class="col-md-4 mb-4">

<div class="card shadow">

<img src="{{ '/static/uploads/' + event[4] if event|length > 4 and event[4] else 'https://picsum.photos/400/200' }}"
class="card-img-top"
style="height:200px;object-fit:cover;">

<div class="card-body">

<h5>{{event[1]}}</h5>

<p>
<b>Date:</b> {{event[2]}} <br>
<b>Venue:</b> {{event[3]}}
</p>

<a href="/delete_event/{{event[0]}}" class="btn btn-danger btn-sm">
Delete
</a>

</div>

</div>

</div>

{% endfor %}

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
