<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
<div class="container">
<span class="navbar-brand">
<i class="bi bi-speedometer2"></i> Admin Dashboard
</span>

<div>
<a href="/" class="btn btn-light btn-sm me-2">Home</a>
<a href="/logout" class="btn btn-danger btn-sm">Logout</a>
</div>
</div>
</nav>


<div class="container mt-4">

<div class="row mb-4">

<div class="col-md-4">
<div class="card text-bg-primary shadow">
<div class="card-body text-center">
<h5><i class="bi bi-calendar-event"></i> Total Events</h5>
<h2>{{ events|length }}</h2>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card text-bg-success shadow">
<div class="card-body text-center">
<h5><i class="bi bi-person-check"></i> Admin Status</h5>
<h2>Active</h2>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card text-bg-warning shadow">
<div class="card-body text-center">
<h5><i class="bi bi-lightning-charge"></i> System</h5>
<h2>Online</h2>
</div>
</div>
</div>

</div>

<h3 class="mb-4">Add Event</h3>

<form method="POST" enctype="multipart/form-data">

<div class="row g-3">

<div class="col-md-4">
<input name="name" class="form-control" placeholder="Event Name" required>
</div>

<div class="col-md-4">
<input type="date" name="date" class="form-control" required>
</div>

<div class="col-md-4">
<input name="venue" class="form-control" placeholder="Venue" required>
</div>

<div class="col-md-4">
<input type="file" name="image" class="form-control">
</div>

</div>

<button class="btn btn-success mt-3">
<i class="bi bi-plus-circle"></i> Add Event
</button>

</form>


<hr class="my-5">

<h3>All Events</h3>

<div class="row">

{% for event in events %}

<div class="col-md-4 mb-4">

<div class="card shadow">

<img src="https://picsum.photos/400/200" class="card-img-top" style="height:200px;object-fit:cover;">

<div class="card-body">

<h5>{{event[1]}}</h5>

<p>
<b>Date:</b> {{event[2]}} <br>
<b>Venue:</b> {{event[3]}}
</p>

<a href="/delete_event/{{event[0]}}" class="btn btn-danger btn-sm">
Delete
</a>

</div>

</div>

</div>

{% endfor %}

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
