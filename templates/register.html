<!DOCTYPE html>
<html>
<head>
    <title>Registrations</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            border-radius: 15px;
        }

        table {
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background-color: #0d6efd;
            color: white;
            text-align: center;
        }

        td {
            text-align: center;
            vertical-align: middle;
        }

        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">
            📋 Registered Students
        </h2>

        <table class="table table-bordered table-hover">

            <thead>
                <tr>
                    <th>👤 Name</th>
                    <th>📧 Email</th>
                    <th>🎯 Event</th>
                </tr>
            </thead>

            <tbody>
                {% for r in registrations %}
                <tr>
                    <td>{{ r[0] }}</td>
                    <td>{{ r[1] }}</td>
                    <td>{{ r[2] }}</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
