<!DOCTYPE html>
<html>
<head>
  <title>Edit Event</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h3>Edit Event</h3>
    <form method="POST">
      <input name="name" class="form-control mb-2" value="{{ event['name'] }}">
      <input type="date" name="date" class="form-control mb-2" value="{{ event['date'] }}">
      <input name="venue" class="form-control mb-2" value="{{ event['venue'] }}">
      <textarea name="description" class="form-control mb-2">{{ event['description'] }}</textarea>
      <button class="btn btn-success">Update</button>
      <a href="/dashboard" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</body>
</html>
